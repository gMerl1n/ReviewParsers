name: Security Pipeline

# Запуск при пуше в main или по расписанию (опционально)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1' # Каждый понедельник в 6 утра

jobs:
  # 1. Анализ кода Python (аналог fast-bandit)
  fast-bandit:
    name: SAST - Bandit Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bandit Security Scan
        uses: mdegis/bandit-action@v1.0
        with:
          path: "."
          level: high
          confidence: high
          exit_zero: false # Упадет при нахождении проблем

  # 2. Сканирование зависимостей (аналог sca-scan)
  sca-scan:
    name: SCA - Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Fail if vulnerabilities found

  # 3. Поиск секретов (аналог secret-detection)
  secret-detection:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Сканирование Docker образа (аналог image-scan)
  image-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    # Сборка образа и сканирование
    steps:
      - uses: actions/checkout@v4

      # Сборка образа (если у тебя свой Dockerfile)
      - name: Build Docker Image
        run: docker build -t my-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'json'
          output: 'trivy-image-results.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Упадет, как на скриншоте "Block on Critical and High"

      # Сохранение артефакта (как шаг "Upload image report" на скрине)
      - name: Upload Image Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-results
          path: trivy-image-results.json

  # 5. Генерация SBOM (аналог sbom-generation)
  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t my-app:${{ github.sha }} .
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.json

  # 6. Шлюз безопасности (аналог security-gate)
  # Этот этап стартует ПОСЛЕ всех проверок и просто завершается успешно,
  # если все предыдущие этапы зеленые. Иначе падал бы один из них.
  security-gate:
    name: Security Gate (All Clear)
    needs: [fast-bandit, sca-scan, secret-detection, image-scan, sbom-generation]
    runs-on: ubuntu-latest
    steps:
      - name: Final Check
        run: echo "All security checks passed!"
