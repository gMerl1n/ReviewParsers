name: Review Parser CI/CD

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - develop

concurrency:
  group: review-parser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY_IMAGE: ghcr.io/username/review-parser

jobs:
  lint_backend:
    name: Lint & Format (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff (linter)
        run: ruff check app/

      - name: Run Ruff (formatter check)
        run: ruff format --check app/

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  test_backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    needs: lint_backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: review_parser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d review_parser_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: ${{ github.workspace }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: review_parser_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SECRET_KEY: test_secret_key_for_ci
      APP_ENVIRONMENT: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U test_user -d review_parser_test; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Run unit tests
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security_sast:
    name: SAST Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: lint_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -q -ll -r app/ \
            -f json \
            -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  security_sca:
    name: SCA Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          ignore-unfixed: true

  security_gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs:
      - security_sast
      - security_sca
    steps:
      - name: Check security status
        shell: bash
        run: |
          if [ "${{ needs.security_sast.result }}" != "success" ] || [ "${{ needs.security_sca.result }}" != "success" ]; then
            echo "Critical security findings detected. Merge blocked."
            exit 1
          fi
          echo "Security gate passed."

  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint_backend
      - test_backend
      - security_gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs:
      - lint_backend
      - test_backend
      - security_gate
      - build_and_push
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINT_RESULT: ${{ needs.lint_backend.result }}
          TEST_RESULT: ${{ needs.test_backend.result }}
          SECURITY_RESULT: ${{ needs.security_gate.result }}
          BUILD_RESULT: ${{ needs.build_and_push.result }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured. Skipping notification."
            exit 0
          fi

          STATUS="FAILED"
          if [ "$LINT_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ] && [ "$SECURITY_RESULT" = "success" ]; then
            STATUS="SUCCESS"
          fi

          MESSAGE="Review Parser CI: ${STATUS}%0A"
          MESSAGE+="PR: ${PR_TITLE}%0A"
          MESSAGE+="Author: ${PR_AUTHOR}%0A%0A"
          MESSAGE+="Lint: ${LINT_RESULT}%0A"
          MESSAGE+="Tests: ${TEST_RESULT}%0A"
          MESSAGE+="Security: ${SECURITY_RESULT}%0A"

          if [ "$BUILD_RESULT" = "success" ]; then
            MESSAGE+="Docker Build: %0A"
          elif [ "$BUILD_RESULT" = "skipped" ]; then
            MESSAGE+="Docker Build: ⏭(push only)%0A"
          else
            MESSAGE+="Docker Build: %0A"
          fi

          MESSAGE+="%0A${PR_URL}"

          curl -s --fail -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" || echo "Failed to send Telegram message"
