name: Review Parser CI/CD

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - develop

concurrency:
  group: review-parser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY_IMAGE: ghcr.io/username/review-parser
  RUFF_VERSION: "0.6.9"
  BANDIT_VERSION: "1.7.9"

jobs:
  # Оптимизация 1: Объединённый линтер и тесты (без дублирования установки)
  lint_and_test:
    name: Lint, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: review_parser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d review_parser_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: ${{ github.workspace }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: review_parser_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SECRET_KEY: test_secret_key_for_ci
      APP_ENVIRONMENT: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Оптимизация 2: Установка всех зависимостей за один раз
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==${{ env.RUFF_VERSION }} bandit==${{ env.BANDIT_VERSION }} pytest pytest-cov pytest-asyncio httpx pre-commit
          pip install -r requirements.txt

      # Оптимизация 3: Линтинг и форматирование без pre-commit (быстрее)
      - name: Run Ruff linter
        run: ruff check app/ --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check app/

      # Оптимизация 4: Упрощённая проверка pre-commit (только важные хуки)
      - name: Run essential pre-commit hooks
        run: |
          pre-commit run trailing-whitespace --all-files || true
          pre-commit run end-of-file-fixer --all-files || true
          pre-commit run check-yaml --all-files || true
          pre-commit run check-json --all-files || true

      - name: Wait for PostgreSQL
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -U test_user -d review_parser_test && break || sleep 1
          done

      # Оптимизация 5: Тесты с минимальным покрытием
      - name: Run unit tests
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml --maxfail=3

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # Оптимизация 6: Security сканы параллельно с тестами (через needs)
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint_and_test
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Оптимизация 7: Bandit без установки всего requirements-dev.txt
      - name: Run Bandit SAST
        run: |
          pip install bandit==${{ env.BANDIT_VERSION }}
          bandit -q -ll -r app/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

      # Оптимизация 8: Trivy только на изменённых файлах (быстрее)
      - name: Run Trivy SCA (quick mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          ignore-unfixed: true
          timeout: 3m

  # Оптимизация 9: Сборка образа только при push в main/develop
  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint_and_test
      - security_scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 8
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Оптимизация 10: Кэширование слоёв Docker
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=short-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
